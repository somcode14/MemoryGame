<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#060813" stroke="url(#neonGrad)" stroke-width="4" />
  
  <!-- Subtle Internal Glow -->
  <circle cx="64" cy="64" r="42" fill="#00f5ff" opacity="0.12" filter="url(#neonGlow)" />
  
  <!-- Stylized Brain Hemispheres & Circuitry -->
  <g fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Left lobe arcs -->
    <path d="M 44 42 C 34 42, 28 50, 28 62 C 28 72, 34 80, 44 82 C 44 88, 52 92, 58 90" />
    <path d="M 38 52 C 44 56, 44 68, 38 72" />
    <!-- Right lobe arcs -->
    <path d="M 84 42 C 94 42, 100 50, 100 62 C 100 72, 94 80, 84 82 C 84 88, 76 92, 70 90" />
    <path d="M 90 52 C 84 56, 84 68, 90 72" />
  </g>

  <!-- Central High-Voltage Lightning Bolt -->
  <polygon points="68,22 42,66 60,66 56,106 86,58 68,58" fill="#00f5ff" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />
</svg>
